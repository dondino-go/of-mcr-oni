appId: com.marta.ofmcroni
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- assertVisible: "FIND MY DRINK"
# Add-a-bar is no longer on the home screen — reach it via results.
- tapOn: "NEGRONI"
- tapOn: "I'M AN EXPLORER"
- tapOn: "FIND MY DRINK"
- tapOn:
    text: "Turn on"
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*nearby.*"
    timeout: 45000
- tapOn: "+ Add a bar"
- assertVisible: "Add a bar"
- tapOn:
    id: ".*"
    text: "Bar name.*"
    optional: true
- inputText: "Northern Quarter"
- extendedWaitUntil:
    visible:
      text: ".*Manchester.*"
    timeout: 30000
# Tap the first venue result card (matches any Manchester address)
- tapOn:
    text: ".*Manchester.*"
    index: 0
- extendedWaitUntil:
    visible: "ADD A MENU PHOTO"
    timeout: 15000
- assertVisible: "Done — back home"
- tapOn: "Done — back home"
- assertVisible: "FIND MY DRINK"
